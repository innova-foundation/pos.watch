# pos.watch — nginx for the Tor onion service.
#
# Listens on a unix socket only, so nothing is reachable on any network
# interface: the site exists solely through Tor. Copy website/ to /srv/pos.watch
# and replace <your-onion> below.
#
# No TLS. The hidden service protocol already authenticates and encrypts, and a
# certificate on an onion buys nothing.

server {
    listen unix:/var/run/tor/pos-watch.sock;
    server_name <your-onion>.onion;

    root /srv/pos.watch;
    index index.html;

    # Do not hand visitors a version number to fingerprint.
    server_tokens off;
    autoindex off;

    # An onion serving a static page has nothing worth logging, and logs are a
    # liability if the box is ever seized.
    access_log off;
    error_log /dev/null crit;

    # Same headers as the clearnet build, minus HSTS (meaningless without TLS)
    # and minus Onion-Location (this IS the onion).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # No connect-src: the page detects .onion and makes no outbound requests,
    # so the CSP can forbid them outright as a second line of defence.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self' 'sha256-4SiywVZunJQ1u8KXkC1NFHDmvwr5htJCtttiiP6SBb0='; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Fonts and images are content-addressed by filename here, but the site is
    # small enough that a short cache is plenty and keeps updates predictable.
    # add_header here replaces, not extends, the server-level set — so the
    # security headers are repeated or JS/CSS would ship without nosniff.
    location ~* \.(woff2|png|ico|css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}
