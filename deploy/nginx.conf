# pos.watch — origin server for the Dell container.
#
# Mirrors the CSP and security headers from website/_headers (which only
# Cloudflare Pages reads). Keep the two in sync when either changes.
# The three load-bearing CSP notes in _headers apply here too:
#   img-src   needs data:  — nes.min.css draws borders/icons from inline data URIs
#   script-src carries the sha256 of the pre-paint skin script in <head> —
#              edit that script and the hash must be recomputed (see _headers)
#   connect-src is exactly the two endpoints script.js calls

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx has no directory listing and no PHP here; kill the noise anyway.
    server_tokens off;

    # Security headers. nginx add_header does NOT inherit into a location
    # that declares its own, so the block is repeated in the assets location.
    # HSTS is sent from here even though TLS ends at Cloudflare's edge — the
    # tunnel passes origin headers through to the browser.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self' 'sha256-4SiywVZunJQ1u8KXkC1NFHDmvwr5htJCtttiiP6SBb0='; connect-src https://chainz.cryptoid.info https://api.coingecko.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Vendored assets change by content, not by date — cache them hard.
    location ~* ^/(img|fonts|vendor)/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The Pages _headers file must not be served by nginx.
    location = /_headers { return 404; }
}
